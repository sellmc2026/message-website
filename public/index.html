<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        type="image/png"
        href="../favicon.png"
    >

    <title>Private Messenger | UtilitEase</title>


    <style>

        /* ========================================
           GENERAL PAGE
           ======================================== */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background-color: #101010;
            color: #ffffff;

            font-family: Arial, sans-serif;
        }


        /* ========================================
           MAIN
           ======================================== */

        #main {
            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        /* ========================================
           CONTAINER
           ======================================== */

        #container {
            width: 450px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 15px;

            padding: 30px;

            box-sizing: border-box;
        }


        /* ========================================
           TITLE
           ======================================== */

        #title {
            margin: 0;

            font-size: 32px;

            text-align: center;
        }


        #subtitle {
            margin: 0 0 15px 0;

            color: #aaaaaa;

            font-size: 16px;

            text-align: center;
        }


        /* ========================================
           MESSAGE CODE
           ======================================== */

        #codeBox {
            width: 100%;

            padding: 18px;

            box-sizing: border-box;

            background-color: #222222;

            border: 2px solid #555555;
            border-radius: 8px;

            text-align: center;

            font-size: 28px;
            font-weight: bold;

            letter-spacing: 4px;

            color: #BEFF8F;
        }


        #copyCodeButton {
            width: 100%;

            padding: 10px;

            box-sizing: border-box;

            background-color: #444444;
            color: #ffffff;

            border: 2px solid #666666;
            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }


        #copyCodeButton:hover {
            background-color: #555555;
        }


        /* ========================================
           GENERATE BUTTON
           ======================================== */

        #generateButton {

            width: 100%;

            padding: 12px;

            box-sizing: border-box;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background-color: #BEFF8F;
            color: #000000;

            border: 2px solid #000000;
        }


        #generateButton:hover {
            background-color: #8FFF3D;
        }


        /* ========================================
           DIVIDER
           ======================================== */

        #divider {
            width: 100%;

            height: 1px;

            margin: 15px 0;

            background-color: #444444;
        }


        /* ========================================
           JOIN INPUT
           ======================================== */

        #codeInput {
            width: 100%;

            padding: 13px;

            box-sizing: border-box;

            background-color: #222222;
            color: #ffffff;

            border: 2px solid #555555;
            border-radius: 8px;

            font-size: 18px;

            text-align: center;

            outline: none;
        }


        #codeInput:focus {
            border-color: #BEFF8F;
        }


        /* ========================================
           JOIN BUTTON
           ======================================== */

        #joinButton {

            width: 100%;

            padding: 12px;

            box-sizing: border-box;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background-color: #444444;
            color: #ffffff;

            border: 2px solid #666666;
        }


        #joinButton:hover {
            background-color: #555555;
        }


        /* ========================================
           STATUS
           ======================================== */

        #status {

            min-height: 20px;

            color: #aaaaaa;

            font-size: 14px;

            text-align: center;
        }


        /* ========================================
           CHAT
           ======================================== */

        #chat {

            display: none;

            width: 100%;

            flex-direction: column;

            gap: 10px;
        }


        /* ========================================
           MESSAGES
           ======================================== */

        #messages {

            width: 100%;

            height: 300px;

            box-sizing: border-box;

            padding: 12px;

            overflow-y: auto;

            background-color: #181818;

            border: 2px solid #444444;

            border-radius: 8px;

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .message {

            max-width: 70%;

            padding: 10px 14px;

            border-radius: 12px;

            word-wrap: break-word;
        }


        /* ========================================
           YOUR MESSAGES
           ======================================== */

        .messageMine {

            align-self: flex-end;

            background-color: #8EFF3B;

            color: #000000;
        }


        /* ========================================
           OTHER PERSON'S MESSAGES
           ======================================== */

        .messageOther {

            align-self: flex-start;

            background-color: #444444;

            color: #ffffff;
        }


        /* ========================================
           MESSAGE INPUT
           ======================================== */

        #messageRow {

            display: flex;

            gap: 8px;

            width: 100%;
        }


        #messageInput {

            flex: 1;

            padding: 11px;

            box-sizing: border-box;

            background-color: #222222;
            color: #ffffff;

            border: 2px solid #555555;

            border-radius: 8px;

            outline: none;

            font-size: 16px;
        }


        #messageInput:focus {

            border-color: #BEFF8F;
        }


        /* ========================================
           SEND BUTTON
           ======================================== */

        #sendButton {

            padding: 11px 18px;

            background-color: #BEFF8F;

            color: #000000;

            border: 2px solid #000000;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;
        }


        #sendButton:hover {

            background-color: #8FFF3D;
        }

    </style>

</head>


<body>


    <main id="main">

        <div id="container">


            <!-- ========================================
                 TITLE
                 ======================================== -->

            <h1 id="title">
                Private Messenger
            </h1>


            <p id="subtitle">
                Create a Message Code or join an existing one.
            </p>


            <!-- ========================================
                 GENERATED CODE
                 ======================================== -->

            <div id="codeBox">
                ----
            </div>


            <button id="copyCodeButton">
                COPY CODE
            </button>


            <button id="generateButton">
                GENERATE MESSAGE CODE
            </button>


            <!-- ========================================
                 DIVIDER
                 ======================================== -->

            <div id="divider"></div>


            <!-- ========================================
                 JOIN
                 ======================================== -->

            <input
                id="codeInput"
                type="text"
                placeholder="Enter Message Code"
                maxlength="9"
            >


            <button id="joinButton">
                JOIN
            </button>


            <div id="status"></div>


            <!-- ========================================
                 CHAT
                 ======================================== -->

            <div id="chat">

                <div id="messages"></div>


                <div id="messageRow">

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Type a message..."
                    >


                    <button id="sendButton">
                        SEND
                    </button>

                </div>

            </div>


        </div>

    </main>


    <!-- ========================================
         SOCKET.IO
         ======================================== -->

    <script src="/socket.io/socket.io.js"></script>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script>

        const socket = io();


        const codeBox =
            document.getElementById("codeBox");

        const copyCodeButton =
            document.getElementById("copyCodeButton");

        const generateButton =
            document.getElementById("generateButton");

        const codeInput =
            document.getElementById("codeInput");

        const joinButton =
            document.getElementById("joinButton");

        const status =
            document.getElementById("status");

        const chat =
            document.getElementById("chat");

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const messages =
            document.getElementById("messages");


        /* ========================================
           GENERATE CODE
           ======================================== */

        function generateCode() {

            const characters =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            let code = "";


            for (let i = 0; i < 8; i++) {

                code +=
                    characters[
                        Math.floor(
                            Math.random() *
                            characters.length
                        )
                    ];

            }


            return (
                code.substring(0, 4)
                + "-"
                + code.substring(4)
            );

        }


        generateButton.addEventListener(
            "click",
            function() {

                const code =
                    generateCode();


                codeBox.textContent =
                    code;


                codeInput.value =
                    code;


                status.textContent =
                    "Code generated.";

            }
        );


        /* ========================================
           COPY CODE
           ======================================== */

        copyCodeButton.addEventListener(
            "click",
            async function() {

                const code =
                    codeBox.textContent;


                if (code === "----") {
                    return;
                }


                await navigator.clipboard.writeText(
                    code
                );


                copyCodeButton.textContent =
                    "COPIED!";


                setTimeout(
                    function() {

                        copyCodeButton.textContent =
                            "COPY CODE";

                    },
                    1000
                );

            }
        );


        /* ========================================
           JOIN ROOM
           ======================================== */

        joinButton.addEventListener(
            "click",
            function() {

                const code =
                    codeInput.value
                        .trim()
                        .toUpperCase();


                if (code.length === 0) {

                    status.textContent =
                        "Enter a Message Code.";

                    return;

                }


                status.textContent =
                    "Joining " + code + "...";


                socket.emit(
                    "joinRoom",
                    code
                );

            }
        );


        /* ========================================
           SUCCESSFULLY JOINED ROOM
           ======================================== */

        socket.on(
            "joinedRoom",
            function(code) {

                status.textContent =
                    "Connected to " + code;


                chat.style.display =
                    "flex";


                messageInput.focus();

            }
        );


        /* ========================================
           SEND MESSAGE
           ======================================== */

        function sendMessage() {

            const text =
                messageInput.value.trim();


            if (text.length === 0) {
                return;
            }


            socket.emit(
                "sendMessage",
                text
            );


            messageInput.value = "";

        }


        sendButton.addEventListener(
            "click",
            sendMessage
        );


        messageInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );


        /* ========================================
           RECEIVE MESSAGE
           ======================================== */

        socket.on(
            "receiveMessage",
            function(data) {

                const message =
                    document.createElement("div");


                message.classList.add(
                    "message"
                );


                /*
                   Check who sent the message.

                   If the sender's socket ID
                   matches our socket ID,
                   it's OUR message.
                */

                if (
                    data.sender === socket.id
                ) {

                    message.classList.add(
                        "messageMine"
                    );

                } else {

                    message.classList.add(
                        "messageOther"
                    );

                }


                message.textContent =
                    data.text;


                messages.appendChild(
                    message
                );


                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    </script>

</body>

</html>
