<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <title>Messagr - Profile</title>

    <style>

        /* ========================================
           RESET
           ======================================== */

        * {
            box-sizing: border-box;
        }


        /* ========================================
           PAGE
           ======================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            background-color: #000000;

            color: #111111;
        }


        body {

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* ========================================
           PROFILE
           ======================================== */

        .profile {

            width: 90%;

            max-width: 430px;

            text-align: center;
        }


        /* ========================================
           PROFILE BOX
           ======================================== */

        .profileBox {

            width: 100%;

            padding: 25px;

            background-color: #fafafa;

            border: 1px solid #dddddd;

            border-radius: 14px;
        }


    </style>

</head>


<body>


    <main class="profile">

        <div class="profileBox">

            <!-- PROFILE CONTENT GOES HERE -->


        </div>

    </main>


</body>

</html>
