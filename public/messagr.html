<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <link rel="icon" type="image/png" href="favicon.png">

    <title>Messagr - Simple Private Messaging</title>

    <meta
        name="description"
        content="Messagr is a simple private messaging website."
    >

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background-color: #101010;
            color: #ffffff;

            font-family: Arial, sans-serif;

        }


        body {

            overflow: hidden;

        }


        /* ========================================
           MAIN DASHBOARD
           ======================================== */

        #dashboard {

            position: relative;

            width: 100vw;
            height: 100vh;

            min-width: 834px;
            min-height: 481px;

        }


        /* ========================================
           LOGO
           x = 375
           y = 56
           ======================================== */

        #logo {

            position: absolute;

            left: 375px;
            top: 56px;

            width: 100px;
            height: 45px;

            object-fit: contain;

        }


        /* ========================================
           TITLE
           x = 375
           y = 115
           ======================================== */

        #title {

            position: absolute;

            left: 375px;
            top: 115px;

            width: 100px;
            height: 45px;

            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            text-align: center;

        }


        /* ========================================
           PROFILE / TOP BUTTONS
           x = 668
           y = 7
           ======================================== */

        #topButtons {

            position: absolute;

            left: 668px;
            top: 7px;

            width: 153px;
            height: 45px;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 5px;

        }


        /* ========================================
           FRIENDS BUTTON
           ======================================== */

        #friendsButton {

            width: 38px;
            height: 38px;

            padding: 5px;

            background-color: #545454;

            border: 3px solid #000000;
            border-radius: 50%;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

        }


        #friendsButton:hover {

            background-color: #212121;

        }


        #friendsButton img {

            width: 25px;
            height: 25px;

            object-fit: contain;

        }


        /* ========================================
           ID BUTTON
           ======================================== */

        #idButton {

            height: 38px;

            padding: 7px 10px;

            background-color: #545454;

            color: #ffffff;

            border: 3px solid #000000;
            border-radius: 8px;

            font-size: 11px;
            font-weight: bold;

            cursor: pointer;

        }


        #idButton:hover {

            background-color: #212121;

        }


        .idRevealed {

            background-color: #ffffff !important;
            color: #000000 !important;

        }


        /* ========================================
           PROFILE BUTTON
           ======================================== */

        #profileButton {

            width: 38px;
            height: 38px;

            padding: 4px;

            background-color: #545454;

            border: 3px solid #000000;
            border-radius: 50%;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

        }


        #profileButton:hover {

            background-color: #212121;

        }


        #profileButton img {

            width: 28px;
            height: 28px;

            object-fit: contain;

        }


        /* ========================================
           DIRECT MESSAGES BUTTON
           x = 655
           y = 61
           ======================================== */

        #directMessagesButton {

            position: absolute;

            left: 655px;
            top: 61px;

            width: 169px;
            height: 45px;

            background-color: #444444;

            color: #ffffff;

            border: 2px solid #666666;
            border-radius: 8px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

        }


        #directMessagesButton:hover {

            background-color: #555555;

        }


        /* ========================================
           DM DROPDOWN
           ======================================== */

        #dmArea {

            position: absolute;

            left: 622px;
            top: 119px;

            width: 200px;
            height: 290px;

            background-color: #181818;

            border: 2px solid #444444;
            border-radius: 10px;

            overflow-y: auto;

            padding: 8px;

            display: none;

            z-index: 100;

        }


        #dmArea.open {

            display: block;

        }


        .dmEmpty {

            width: 100%;

            padding: 25px 10px;

            color: #888888;

            font-size: 13px;

            text-align: center;

        }


        .dmFriend {

            width: 100%;

            padding: 10px;

            margin-bottom: 6px;

            background-color: #292929;

            border: 1px solid #444444;

            border-radius: 7px;

            color: #ffffff;

            text-align: left;

            cursor: pointer;

        }


        .dmFriend:hover {

            background-color: #3a3a3a;

        }


        /* ========================================
           JOIN ROOM
           x = 35
           y = 210
           ======================================== */

        #joinButton {

            position: absolute;

            left: 35px;
            top: 210px;

            width: 117px;
            height: 45px;

            padding: 0;

            background-color: #BEFF8F;

            color: #000000;

            border: 2px solid #000000;
            border-radius: 8px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

        }


        #joinButton:hover {

            background-color: #8FFF3D;

        }


        /* ========================================
           ROOM CODE INPUT
           ======================================== */

        #codeInput {

            position: absolute;

            left: 35px;
            top: 160px;

            width: 220px;
            height: 38px;

            padding: 8px;

            background-color: #222222;

            color: #ffffff;

            border: 2px solid #555555;
            border-radius: 8px;

            outline: none;

            text-align: center;

        }


        #codeInput:focus {

            border-color: #BEFF8F;

        }


        /* ========================================
           SAVED ROOMS
           x = 35
           y = 270
           ======================================== */

        #savedRooms {

            position: absolute;

            left: 35px;
            top: 270px;

            width: 220px;
            height: 300px;

            background-color: #181818;

            border: 2px solid #444444;
            border-radius: 10px;

            padding: 8px;

            overflow-y: auto;

        }


        /* ========================================
           SAVED ROOM
           ======================================== */

        .savedRoom {

            width: 100%;
            min-height: 42px;

            display: flex;

            align-items: center;

            margin-bottom: 6px;

            background-color: #292929;

            border: 1px solid #444444;

            border-radius: 7px;

        }


        .savedRoomButton {

            flex: 1;

            height: 40px;

            padding: 7px;

            background: transparent;

            border: none;

            color: #ffffff;

            text-align: left;

            cursor: pointer;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

        }


        .savedRoomButton:hover {

            background-color: #333333;

        }


        /* ========================================
           ROOM EDIT BUTTON
           ======================================== */

        .editRoomButton {

            width: 32px;
            height: 32px;

            margin-right: 5px;

            padding: 5px;

            background-color: transparent;

            border: none;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

        }


        .editRoomButton:hover {

            background-color: #444444;

            border-radius: 5px;

        }


        .editRoomButton img {

            width: 20px;
            height: 20px;

            object-fit: contain;

        }


        /* ========================================
           BIG CHAT BOX
           x = 267
           y = 210
           ======================================== */

        #chat {

            position: absolute;

            left: 267px;
            top: 210px;

            width: 420px;
            height: 350px;

            display: flex;

            flex-direction: column;

        }


        /* ========================================
           MESSAGES
           ======================================== */

        #messages {

            width: 100%;

            height: 290px;

            padding: 12px;

            overflow-y: auto;

            background-color: #181818;

            border: 2px solid #444444;
            border-radius: 8px;

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        /* ========================================
           MESSAGE
           ======================================== */

        .message {

            max-width: 70%;

            padding: 10px 14px;

            border-radius: 12px;

            word-wrap: break-word;

        }


        .messageMine {

            align-self: flex-end;

            background-color: #8EFF3B;

            color: #000000;

        }


        .messageOther {

            align-self: flex-start;

            background-color: #444444;

            color: #ffffff;

        }


        /* ========================================
           SYSTEM MESSAGE
           ======================================== */

        .systemMessage {

            align-self: flex-start;

            color: #000000;

            background-color: #FFE658;

            font-size: 13px;

            padding: 15px;

            margin: 5px 0;

            border-radius: 8px;

        }


        /* ========================================
           MESSAGE ROW
           ======================================== */

        #messageRow {

            width: 100%;

            height: 50px;

            display: flex;

            gap: 8px;

            margin-top: 8px;

        }


        #messageInput {

            flex: 1;

            min-width: 0;

            padding: 11px;

            background-color: #222222;

            color: #ffffff;

            border: 2px solid #555555;

            border-radius: 8px;

            outline: none;

            font-size: 14px;

        }


        #messageInput:focus {

            border-color: #BEFF8F;

        }


        .messageControls {

            display: flex;

            gap: 8px;

        }


        /* ========================================
           IMAGE BUTTON
           ======================================== */

        #imageButton {

            width: 50px;
            height: 42px;

            padding: 0;

            background-color: #444444;

            border: 2px solid #666666;
            border-radius: 8px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

        }


        #imageButton:hover {

            background-color: #555555;

        }


        #imageButton img {

            width: 30px;
            height: 30px;

        }


        /* ========================================
           SEND BUTTON
           ======================================== */

        #sendButton {

            width: 50px;
            height: 42px;

            padding: 0;

            background-color: #BEFF8F;

            border: 2px solid #000000;
            border-radius: 8px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

        }


        #sendButton:hover {

            background-color: #8FFF3D;

        }


        #sendButton img {

            width: 30px;
            height: 30px;

        }


        /* ========================================
           CODE / GENERATE AREA
           ======================================== */

        #codeBox,
        #copyCodeButton,
        #generateButton,
        #muteButton,
        #divider,
        #status,
        #subtitle {

            display: none;

        }


        /* ========================================
           IMAGE LOADING
           ======================================== */

        .imageLoadingMessage {

            align-self: flex-end;

            background-color: #444444;

            border-radius: 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

        }


        .imageLoadingSpinner {

            width: 32px;
            height: 32px;

            border: 4px solid #777777;

            border-top: 4px solid #ffffff;

            border-radius: 50%;

            animation: imageLoadingSpin 0.8s linear infinite;

        }


        @keyframes imageLoadingSpin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* ========================================
           UPLOAD ERROR
           ======================================== */

        .uploadError {

            position: fixed;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            background-color: #444444;

            color: #ffffff;

            border: 2px solid #666666;

            border-radius: 8px;

            padding: 12px 20px;

            font-size: 14px;
            font-weight: bold;

            z-index: 9999;

            transition: opacity 0.3s ease;

        }


        .uploadError.hide {

            opacity: 0;

        }


    </style>

</head>


<body>


<div id="dashboard">


    <!-- ========================================
         LOGO
         ======================================== -->

    <img
        id="logo"
        src="logo.png"
        alt="Messagr"
    >


    <!-- ========================================
         TITLE
         ======================================== -->

    <h1 id="title">
        Messagr
    </h1>


    <!-- ========================================
         TOP RIGHT BUTTONS
         ======================================== -->

    <div id="topButtons">


        <button id="friendsButton">

            <img
                src="friends-icon.png"
                alt="Friends"
            >

        </button>


        <button id="idButton">
            Your ID
        </button>


        <button id="profileButton">

            <img
                src="profile-icon.png"
                alt="Profile"
            >

        </button>


    </div>


    <!-- ========================================
         DIRECT MESSAGES
         ======================================== -->

    <button id="directMessagesButton">
        Direct Messages
    </button>


    <!-- ========================================
         DM POPUP
         ======================================== -->

    <div id="dmArea">

        <div class="dmEmpty">
            No friends yet.
        </div>

    </div>


    <!-- ========================================
         ROOM CODE INPUT
         ======================================== -->

    <input
        id="codeInput"
        type="text"
        placeholder="Enter Room Code"
        maxlength="9"
        autocomplete="off"
    >


    <!-- ========================================
         JOIN ROOM
         ======================================== -->

    <button id="joinButton">
        JOIN ROOM
    </button>


    <!-- ========================================
         SAVED ROOMS
         ======================================== -->

    <div id="savedRooms">

        <!-- Rooms will be added here by JavaScript -->

    </div>


    <!-- ========================================
         CHAT
         ======================================== -->

    <div id="chat">


        <div id="messages"></div>


        <!-- ========================================
             MESSAGE ROW
             ======================================== -->

        <div id="messageRow">


            <input
                id="messageInput"
                type="text"
                placeholder="Type a message..."
                autocomplete="off"
            >


            <!-- HIDDEN IMAGE PICKER -->

            <input
                type="file"
                id="imageInput"
                accept="image/png, image/jpeg, image/gif, image/webp"
                hidden
            >


            <div class="messageControls">


                <button id="imageButton">

                    <img
                        src="image.png"
                        alt="Upload Image"
                    >

                </button>


                <button id="sendButton">

                    <img
                        src="send.png"
                        alt="Send Message"
                    >

                </button>


            </div>


        </div>


    </div>


</div>


<!-- ========================================
     SOCKET.IO
     ======================================== -->

<script src="/socket.io/socket.io.js"></script>


<!-- ========================================
     BASIC DASHBOARD CONTROLS
     ======================================== -->

<script>


/* ========================================
   USER ID
   ======================================== */

const messagrID =
    localStorage.getItem("messagrID");


const idButton =
    document.getElementById("idButton");


idButton.addEventListener(
    "click",
    function() {

        idButton.classList.toggle(
            "idRevealed"
        );


        if (
            idButton.classList.contains(
                "idRevealed"
            )
        ) {

            idButton.textContent =
                messagrID || "Unknown";

        } else {

            idButton.textContent =
                "Your ID";

        }

    }
);


/* ========================================
   PROFILE
   ======================================== */

const profileButton =
    document.getElementById("profileButton");


profileButton.addEventListener(
    "click",
    function() {

        window.location.href =
            "messagr-profile.html";

    }
);


/* ========================================
   DIRECT MESSAGES POPUP
   ======================================== */

const directMessagesButton =
    document.getElementById(
        "directMessagesButton"
    );


const dmArea =
    document.getElementById(
        "dmArea"
    );


directMessagesButton.addEventListener(
    "click",
    function() {

        dmArea.classList.toggle(
            "open"
        );

    }
);


/* ========================================
   CLOSE DM MENU WHEN CLICKING ELSEWHERE
   ======================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !dmArea.contains(event.target) &&
            event.target !== directMessagesButton
        ) {

            dmArea.classList.remove(
                "open"
            );

        }

    }
);


</script>


<!-- ========================================
     MAIN MESSAGR JAVASCRIPT
     ======================================== -->

<script src="script.js"></script>


</body>

</html>
